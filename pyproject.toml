[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "landscape-analysis"
version = "0.1.0"
description = "Deterministic collection tool for reproducible scholarly + code landscape analysis (Phase A)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
landscape = "landscape.cli:main"

[tool.setuptools.packages.find]
include = ["landscape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
